<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenRC2 虚拟手柄</title>
<style>
  :root{
    --bg:#070b12; --panel:rgba(24,32,44,.62); --line:rgba(255,255,255,.10);
    --tx:#eaf1f8; --dim:#8b9bb0; --teal:#2dd4bf; --amber:#f5b942; --red:#ff6b6b;
    --sh:0 22px 60px rgba(0,0,0,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    padding:16px; color:var(--tx);
    font:14px/1.45 "Micr0soft YaHei UI","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    background:#05080d; display:flex; flex-direction:column; min-height:100%; overflow:hidden;
  }
  #wall{position:fixed;inset:-40px;background-image:url(/bg);background-size:cover;background-position:center;z-index:0;
        filter:blur(16px) saturate(150%) brightness(.72);transform:scale(1.1)}
  #veil{position:fixed;inset:0;z-index:1;
        background:radial-gradient(110% 80% at 15% 0%,rgba(45,212,191,.14),transparent 62%),
                   radial-gradient(90% 70% at 92% 8%,rgba(245,185,66,.12),transparent 60%),
                   linear-gradient(170deg,rgba(6,10,16,.42),rgba(6,10,16,.80))}
  .wrap{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;gap:13px;min-height:0}

  header,footer,section.card{
    background:linear-gradient(180deg,rgba(32,42,56,.66),rgba(18,26,36,.72));
    border:1px solid rgba(255,255,255,.11);border-radius:20px;
    backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
    box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.13);
  }
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;flex:none}
  .brand{font-size:21px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .brand span{font-size:12px;font-weight:400;color:var(--dim);margin-left:9px;letter-spacing:0}
  .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
        background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12.5px;color:var(--dim);white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background .2s}
  .dot.on{background:var(--teal);box-shadow:0 0 10px var(--teal)}
  .dot.warn{background:var(--amber);box-shadow:0 0 10px var(--amber)}
  .hero{display:flex;align-items:baseline;gap:5px;padding:4px 16px;border-radius:14px;
        background:linear-gradient(180deg,rgba(45,212,191,.16),rgba(45,212,191,.05));
        border:1px solid rgba(45,212,191,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
  .heroNum{font-size:26px;font-weight:750;letter-spacing:-.5px;color:var(--teal);
           font-variant-numeric:tabular-nums;min-width:46px;text-align:right;line-height:1}
  .heroUnit{font-size:11px;color:var(--dim)}

  main{flex:1;display:grid;grid-template-columns:minmax(296px,336px) minmax(0,1fr);gap:13px;min-height:0}
  section.card{padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
  h2{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:1.2px;text-transform:none}
  .group{display:flex;flex-direction:column;gap:8px}
  .hint{font-size:11.5px;color:var(--dim)}

  /* 分段选择器：纯 flex 等分，没有任何绝对定位 */
  .seg{display:flex;gap:7px}
  .seg button{flex:1 1 0;min-width:0;padding:11px 4px;border-radius:12px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx);
    font:600 13px/1 "Microsoft YaHei UI",sans-serif;transition:background .14s,color .14s,transform .06s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg button:hover{background:rgba(255,255,255,.11)}
  .seg button:active{transform:scale(.97)}
  .seg button.on{background:var(--teal);border-color:transparent;color:#04211c}

  .slide{display:grid;grid-template-columns:1fr 52px;gap:10px;align-items:center}
  input[type=range]{width:100%;accent-color:var(--teal)}
  .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}

  /* 六条通道：grid 固定列宽，行等分，文字不会被挤到别的行 */
  .bars{display:grid;grid-template-rows:repeat(6,1fr);gap:8px;min-height:0;flex:1}
  .bar{display:grid;grid-template-columns:112px minmax(80px,1fr) 58px;gap:12px;align-items:center;min-height:30px}
  .bar .name{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track{position:relative;height:12px;border-radius:999px;overflow:hidden;
         background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
         box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
  .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
  .fill{position:absolute;top:0;bottom:0;left:50%;width:0;border-radius:999px;box-shadow:0 0 12px rgba(45,212,191,.5);
        background:var(--teal);transition:left .04s linear,width .04s linear,background .2s}
  .bar .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;
           padding:3px 7px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}

  footer{display:flex;align-items:center;gap:11px;padding:13px 18px;flex:none;flex-wrap:wrap}
  .btn{padding:11px 24px;border-radius:13px;border:1px solid var(--line);cursor:pointer;
       background:rgba(255,255,255,.06);color:var(--tx);font:600 14px/1 "Microsoft YaHei UI",sans-serif;
       transition:background .14s,transform .06s}
  .btn:hover{background:rgba(255,255,255,.13)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(180deg,#ffcd6b,#f0a821);border-color:transparent;color:#231703;min-width:132px;
       box-shadow:0 8px 22px rgba(240,168,33,.28)}
  .btn.primary.stop{background:var(--red);color:#2a0a0a}
  .status{color:var(--dim);font-size:12.5px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .metrics{display:flex;gap:8px}
</style>
</head>
<body>
<div id="wall"></div><div id="veil"></div>

<div class="wrap">
  <header>
    <div class="brand">OpenRC2<span>虚拟手柄 · PC 端</span></div>
    <div class="spacer"></div>
    <div class="chip"><i class="dot" id="dot"></i><span id="conn">等待中</span></div>
    <div class="hero"><div class="heroNum" id="lag">—</div><div class="heroUnit">ms 延迟</div></div>
  </header>

  <main>
    <section class="card">
      <h2>手柄类型</h2>
      <div class="seg" id="segMode">
        <button data-v="xbox" class="on">Xbox 360</button>
        <button data-v="fvp">FVP 手感</button>
      </div>

      <h2>遥控器型号</h2>
      <div class="seg" id="segModel">
        <button data-v="0" class="on">自动</button>
        <button data-v="1">RC2</button>
        <button data-v="2">RC Pro</button>
      </div>

      <h2>延迟优化</h2>
      <div class="seg" id="segPred">
        <button data-v="0">关</button>
        <button data-v="1">弱</button>
        <button data-v="2" class="on">中</button>
        <button data-v="3">强</button>
      </div>
      <div class="hint" id="predHint">预测 100ms · 反向即停</div>

      <h2>死区 / 曲线</h2>
      <div class="group">
        <div class="slide"><input id="dz" type="range" min="0" max="30" value="6"><div class="val" id="dzv">6%</div></div>
        <div class="slide"><input id="ex" type="range" min="50" max="100" value="100"><div class="val" id="exv">1.00</div></div>
      </div>
    </section>

    <section class="card">
      <h2>摇杆实时数据</h2>
      <div class="bars" id="bars"></div>
    </section>
  </main>

  <footer>
    <button class="btn primary" id="btnRun">启动</button>
    <button class="btn" id="btnSelf">自检</button>
    <button class="btn" id="btnConn">连接遥控器</button>
    <button class="btn" id="btnJoy">joy.cpl</button>
    <div class="status" id="status">就绪</div>
    <div class="metrics">
      <div class="chip"><span id="hz">0 Hz</span></div>
      <div class="chip"><span id="frames">0 帧</span></div>
    </div>
  </footer>
</div>

<script>
const NAMES = ["左水平 · 偏航","左竖直 · 油门","右水平 · 副翼","右竖直 · 俯仰","左波轮","右波轮"];
const barsEl = document.getElementById("bars");
const barEls = NAMES.map(n => {
  const row = document.createElement("div"); row.className = "bar";
  const name = document.createElement("div"); name.className = "name"; name.textContent = n;
  const track = document.createElement("div"); track.className = "track";
  const mid = document.createElement("div"); mid.className = "mid";
  const fill = document.createElement("div"); fill.className = "fill";
  track.append(mid, fill);
  const num = document.createElement("div"); num.className = "num"; num.textContent = "1024";
  row.append(name, track, num);
  barsEl.append(row);
  return {fill, num};
});

const $ = id => document.getElementById(id);
let running = false, pred = 2;

const HINTS = [
  "关闭预测：原始数据直推，最稳但更滞后",
  "预测 50ms：温和，基本不过冲",
  "预测 100ms：平衡",
  "预测 160ms：最跟手，快速反向可能略过冲"
];

function segInit(id, cb){
  const box = $(id);
  box.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || !box.contains(b)) return;
    [...box.children].forEach(x => x.classList.toggle("on", x === b));
    cb(b.dataset.v);
  });
}

async function cmd(body){
  try{
    const r = await fetch("/cmd", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    return await r.json();
  }catch(err){ $("status").textContent = "核心未启动：" + err.message; return null; }
}

segInit("segMode",  v => cmd({mode: v}));
segInit("segModel", v => cmd({model: Number(v)}));
segInit("segPred",  v => { pred = Number(v); $("predHint").textContent = HINTS[pred]; cmd({pred: pred}); });

$("dz").addEventListener("input", e => {
  const v = Number(e.target.value); $("dzv").textContent = v + "%"; cmd({deadzone: v});
});
$("ex").addEventListener("input", e => {
  const v = Number(e.target.value) / 100; $("exv").textContent = v.toFixed(2); cmd({expo: v});
});

$("btnRun").addEventListener("click", async () => {
  const r = await cmd({start: !running});
  if (r && r.ok){ running = !running; paintRun(); }
  else if (r) $("status").textContent = r.err || "启动失败";
});
$("btnConn").addEventListener("click", () => { $("status").textContent = "正在建 adb 反向…"; cmd({connect: true}); });
$("btnSelf").addEventListener("click", () => { $("status").textContent = "正在扫杆…"; cmd({selftest: true}); });
$("btnJoy").addEventListener("click", () => cmd({joycpl: true}));

function paintRun(){
  const b = $("btnRun");
  b.textContent = running ? "停止" : "启动";
  b.classList.toggle("stop", running);
}

function setBar(i, v){
  v = Math.max(0, Math.min(2047, Number(v) || 1024));
  const t = (v - 1024) / 1024;
  const pct = Math.min(1, Math.abs(t)) * 50;
  const el = barEls[i];
  el.fill.style.background = t >= 0 ? "var(--teal)" : "var(--amber)";
  el.fill.style.left = (t >= 0 ? 50 : 50 - pct) + "%";
  el.fill.style.width = pct + "%";
  el.num.textContent = v;
}

function paintState(s){
  $("dot").className = "dot " + (s.running ? "on" : (s.connected ? "warn" : ""));
  $("conn").textContent = s.padOk === false ? "虚拟手柄不可用" : (s.running ? "运行中" : (s.connected ? "已连接" : "等待遥控器"));
  $("lag").textContent = (s.lagMs >= 0 ? s.lagMs : "—");
  $("hz").textContent = (s.srcHz || 0).toFixed(1) + " Hz";
  $("frames").textContent = (s.frames || 0) + " 帧";
  if (s.pred != null && s.pred !== pred){
    pred = s.pred;
    [...$("segPred").children].forEach(b => b.classList.toggle("on", Number(b.dataset.v) === pred));
    $("predHint").textContent = HINTS[pred];
  }
  if (s.running !== running){ running = s.running; paintRun(); }
  const adb = s.adb || {};
  if (!s.connected && adb.msg) $("status").textContent = adb.msg + " · 等待推流";
  else if (s.padErr) $("status").textContent = s.padErr;
  else if (s.src) $("status").textContent = s.src;
}

let es = null;
function connect(){
  es = new EventSource("/events");
  es.onmessage = ev => {
    let s; try { s = JSON.parse(ev.data); } catch(e){ return; }
    const ax = s.ax || [];
    for (let i = 0; i < 6; i++) setBar(i, ax[i] != null ? ax[i] : 1024);
    paintState(s);
  };
  es.onerror = () => { try{es.close();}catch(e){} setTimeout(connect, 1200); };
}
$("status").textContent = "正在连接核心…";
connect();
paintRun();
$("predHint").textContent = HINTS[2];
</script>
</body>
</html>
